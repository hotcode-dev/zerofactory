# docker-compose.yml — Qwen3.6-27B v4 Production Deployment on DGX Spark
#
# Credits:
# Based on the official v4 DFlash deployment guide and research by AEON-7.
# Original Repository: https://github.com/AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-DFlash
#
# Description:
# This configuration is explicitly tuned for the GB10 (sm_121a) architecture with 128GB unified memory.
# It includes strict safety ceilings to prevent CUDA deadlocks during heavy multi-agent workflows,
# utilizing the Multimodal-NVFP4-MTP-XS checkpoint and DFlash speculative decoding.

services:
  vllm:
    # ─── v4 DFlash Image ───
    image: ghcr.io/aeon-7/vllm-aeon-ultimate-dflash:qwen36-v4
    container_name: aeon-ultimate-xs
    restart: unless-stopped
    network_mode: host
    ipc: host
    ulimits:
      memlock: -1

    environment:
      # ─── Core vLLM ───
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1

      # ─── GB10 / sm_121a runtime ───
      - TORCH_CUDA_ARCH_LIST=12.1a
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_MATMUL_PRECISION=high
      - NVIDIA_FORWARD_COMPAT=1
      - NVIDIA_DISABLE_REQUIRE=1

      # Required by PR #40191 for sm_121a-only builds — without this,
      # vllm._C_stable_libtorch.abi3.so fails to import.
      - ENABLE_NVFP4_SM100=0

      # ─── FP4 path selection ───
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - VLLM_TEST_FORCE_FP8_MARLIN=0
      - VLLM_USE_FLASHINFER_SAMPLER=1
      # XS-specific: explicitly select the patched CUTLASS NVFP4 GEMM backend.
      - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass

    volumes:
      # ─── Model Checkpoints ───
      # Note: Ensure you have pulled the `modelopt` format XS checkpoint for v4.
      - ./models/aeon-ultimate-multimodal-nvfp4-mtp-xs:/models/xs
      - ./models/dflash-drafter:/models/dflash-drafter

    command:
      - bash
      - -c
      - |
        exec vllm serve /models/xs \
          --served-model-name aeon-ultimate qwen36-ultimate aeon-fast aeon-deep aeon-ultimate-xs \
          --host 0.0.0.0 --port 8000 \
          --tensor-parallel-size 1 \
          --dtype auto \
          --load-format safetensors \
          --trust-remote-code \
          --quantization modelopt \
          --kv-cache-dtype auto \
          --max-model-len 256000 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 32768 \
          --enable-chunked-prefill \
          --gpu-memory-utilization 0.85 \
          --enable-prefix-caching \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser qwen3 \
          --attention-backend flash_attn \
          --limit-mm-per-prompt '{"image": 4, "video": 2}' \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --mm-shm-cache-max-object-size-mb 256 \
          --speculative-config '{"method":"dflash","model":"/models/dflash-drafter","num_speculative_tokens":15}'

        # Notes on command configuration:
        #   - Quantization: `modelopt` is required for the recommended v4 XS body
        #     to preserve SSM kernel stability.
        #   - Memory/concurrency safety ceilings:
        #     * `max-model-len 256000` is a hard context cap.
        #     * `max-num-seqs 8` is a hard parallel-request cap for DFlash stability.
        #     * `max-num-batched-tokens 32768` is the chunked-prefill safety valve.
        #     * `gpu-memory-utilization 0.85` keeps usage within DGX Spark limits.
        #   - Agentic optimization: prefix caching is enabled to avoid recomputing
        #     identical system prompts/tool definitions.
        #   - Architecture/multimodal: `mm-shm-cache-max-object-size-mb 256`
        #     prevents large image/video objects from overflowing shared memory.
        #   - Speculative decoding: DFlash is enabled at `k=15` with the
        #     architecture-matched drafter.
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Gives FlashInfer NVFP4 GEMM autotuner time to cache on first boot
      start_period: 600s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
