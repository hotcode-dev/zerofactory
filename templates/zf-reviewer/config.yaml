description: Code reviewer & quality gatekeeper for Zero Factory
toolsets:
  - kanban
  - file
  - terminal
  - search_files
  - web
  - skills
  - mcp
  - web_search
  - web_extract
  - process
  - read_file
  - patch
  - todo
  - clarify
  - execute_code
  - delegate_task
  - memory
  - session_search
agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  reasoning_effort: medium
  disabled_toolsets:
    - image_gen
    - tts
    - discord
    - slack
    - telegram
    - whatsapp
    - mattermost
    - matrix
    - x_search
    - spotify
    - homeassistant
plugins:
  enabled:
    - zerofactory
default:
  temperature: 0.0
