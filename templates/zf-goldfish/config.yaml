description: Spec auditor & YAGNI gatekeeper for Zero Factory
toolsets:
  - file
agent:
  max_turns: 30
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 1800
  reasoning_effort: medium
  disabled_toolsets:
    - terminal
    - web
    - image_gen
    - tts
    - discord
    - slack
    - telegram
    - whatsapp
    - mattermost
    - matrix
    - x_search
    - spotify
    - homeassistant
plugins:
  enabled:
    - zerofactory
default:
  temperature: 0.0

