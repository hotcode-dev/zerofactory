version: '3.8'

services:
  zerofactory:
    build: .
    ports:
      - "18780:18780"
    environment:
      - PORT=18780
      # Add API keys below in production or load from .env
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # Optional: mount a local SQLite database for persistence once checkpointer is implemented
      - ./.data:/app/.data
    restart: unless-stopped
