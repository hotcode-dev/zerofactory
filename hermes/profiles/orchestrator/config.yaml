curator:
  enabled: true
  interval_hours: 24
  min_idle_hours: 1
  stale_after_days: 14
  archive_after_days: 60
  backup:
    enabled: true
    keep: 10
honcho: {}
timezone: ''
slack:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  channel_prompts: {}
discord:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true
  thread_require_mention: false
  history_backfill: true
  history_backfill_limit: 100
  reactions: true
  channel_prompts: {}
whatsapp: {}
telegram:
  reactions: false
  channel_prompts: {}
  allowed_chats: ''
mattermost:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  channel_prompts: {}
matrix:
  require_mention: true
  free_response_rooms: ''
  allowed_rooms: ''
approvals:
  mode: manual
  timeout: 120
  cron_mode: allow
  mcp_reload_confirm: true
  destructive_slash_confirm: true
command_allowlist: []
quick_commands: {}
hooks: {}
hooks_auto_accept: false
personalities: {}
security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
  acked_advisories: []
  allow_lazy_installs: true
cron:
  wrap_response: true
  max_parallel_jobs: 10
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 30
  failure_limit: 3
  worker_log_rotate_bytes: 4194304
  worker_log_backup_count: 3
  orchestrator_profile: ''
  default_assignee: ''
  auto_decompose: true
  auto_decompose_per_tick: 5
  dispatch_stale_timeout_seconds: 7200
code_execution:
  mode: project
  timeout: 600
  max_tool_calls: 100
logging:
  level: INFO
  max_size_mb: 10
  backup_count: 5
paste_collapse_threshold: 5
paste_collapse_threshold_fallback: 0
_config_version: 24
provider: ''
system_prompt: "You are Orchestrator, the CEO of Zero Factory AI company.\n\nYour role:\n  - Decompose complex goals into parallelizable work packages\n  - Dispatch tasks to specialist agents (Builder, Researcher, Reviewer, QA, Scribe)\n  - Monitor kanban board progress and unblock stalled work\n  - Coordinate handoffs between development stages\n  - Track dependencies and decide what can run in parallel\n  - Report concise status to human when needed\n  - Never write code directly — delegate coding to Builder\n  - Never review code directly — delegate to Reviewer\n\nWorkflow Pipeline:\n  Goal → Researcher (analyze) → Builder (implement) → Reviewer (review) → QA (test) → Scribe (document) → Done\n\nCommunication Style:\n  - Concise, direct, action-oriented\n  - Reference task IDs and kanban states\n  - Summarize status clearly when reporting to human\n\nConstraints:\n  - Respect hardware limits for concurrency\n  - Minimize token usage across all agents\n  - Keep workflows to fewest steps possible\n  - Zero temperature — logical, deterministic decisions\n\nOutput format: Status reports, dispatch instructions, dependency mapping, escalation flags.\n"
description: Project manager & orchestrator
