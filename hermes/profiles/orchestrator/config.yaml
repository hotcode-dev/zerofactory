# Model and provider configuration.
model:
  default: qwen36-fast
  provider: custom
custom_providers:
- name: Spark.ntsd.dev:8000
  base_url: http://spark.ntsd.dev:8000/v1
  model: qwen36-fast
providers: {}
default:
  temperature: 0
fallback_providers: []

credential_pool_strategies: {}
toolsets:
- kanban
- delegation
- file
- terminal
- web
- search_files
- cronjob
- skills
- mcp
agent:
  max_turns: 120
  gateway_timeout: 3600
  restart_drain_timeout: 300
  api_max_retries: 5
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 1800
  clarify_timeout: 600
  gateway_notify_interval: 300
  gateway_auto_continue_freshness: 7200
  image_input_mode: auto
  disabled_toolsets:
  - image_gen
  - tts
  - x_search
  - spotify
  - homeassistant
  verbose: false
  reasoning_effort: high
  personalities: {}
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 300
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  persistent_shell: true
  lifetime_seconds: 600
web:
  backend: ''
  search_backend: ''
  extract_backend: ''
browser:
  inactivity_timeout: 300
  command_timeout: 60
  record_sessions: false
  allow_private_urls: false
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  dialog_policy: must_respond
checkpoints:
  enabled: true
  max_snapshots: 50
  max_total_size_mb: 1000
  max_file_size_mb: 20
  auto_prune: true
  retention_days: 14
file_read_max_chars: 100000
tool_output:
  max_bytes: 100000
  max_lines: 3000
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 3
    same_tool_failure: 5
    idempotent_no_progress: 3
  hard_stop_after:
    exact_failure: 8
    same_tool_failure: 12
    idempotent_no_progress: 8
compression:
  enabled: true
  threshold: 0.3
  target_ratio: 0.15
  protect_last_n: 30
  hygiene_hard_message_limit: 500
  protect_first_n: 5
prompt_caching:
  cache_ttl: 10m
openrouter:
  response_cache: true
  response_cache_ttl: 300
bedrock:
  region: ''
  discovery:
    enabled: true
    provider_filter: []
    refresh_interval: 3600
auxiliary:
  vision:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
    extra_body: {}
    download_timeout: 30
  web_extract:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 360
    extra_body: {}
  compression:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
    extra_body: {}
  skills_hub:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
    extra_body: {}
  approval:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
    extra_body: {}
  mcp:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
    extra_body: {}
  title_generation:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
    extra_body: {}
  triage_specifier:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
    extra_body: {}
  kanban_decomposer:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 180
    extra_body: {}
  profile_describer:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 60
    extra_body: {}
  curator:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 600
    extra_body: {}
display:
  compact: false
  personality: technical
  resume_display: full
  busy_input_mode: interrupt
  tui_auto_resume_recent: false
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  timestamps: false
  final_response_markdown: strip
  persistent_output: true
  persistent_output_max_lines: 500
  inline_diffs: true
  file_mutation_verifier: true
  show_cost: false
  skin: default
  language: en
  tui_status_indicator: kaomoji
  user_message_preview:
    first_lines: 3
    last_lines: 3
  interim_assistant_messages: true
  tool_progress_command: false
  tool_progress_overrides: {}
  tool_preview_length: 0
  ephemeral_system_ttl: 0
  platforms: {}
  runtime_footer:
    enabled: true
    fields:
    - model
    - context_pct
    - cwd
    - status
  copy_shortcut: auto
  tool_progress: all
  cleanup_progress: false
  background_process_notifications: all
dashboard:
  theme: default
  show_token_analytics: false
privacy:
  redact_pii: false
tts:
  provider: edge
  edge:
    voice: en-US-AriaNeural
stt:
  enabled: true
  provider: local
  local:
    model: base
    language: ''
voice:
  record_key: ctrl+b
  max_recording_seconds: 120
  auto_tts: false
  beep_enabled: true
  silence_threshold: 200
  silence_duration: 3.0
human_delay:
  mode: 'off'
  min_ms: 800
  max_ms: 2500
context:
  engine: compressor
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000
  user_char_limit: 1800
  provider: ''
delegation:
  model: ''
  provider: ''
  base_url: ''
  api_key: ''
  api_mode: ''
  inherit_mcp_toolsets: true
  max_iterations: 100
  child_timeout_seconds: 900
  reasoning_effort: ''
  max_concurrent_children: 5
  max_spawn_depth: 2
  orchestrator_enabled: true
  subagent_auto_approve: false
prefill_messages_file: ''
goals:
