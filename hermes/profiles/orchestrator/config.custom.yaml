toolsets:
- kanban
- delegation
- file
- terminal
- web
- search_files
- cronjob
- skills
- mcp
agent:
  max_turns: 120
  gateway_timeout: 3600
  restart_drain_timeout: 300
  api_max_retries: 5
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 1800
  clarify_timeout: 600
  gateway_notify_interval: 300
  gateway_auto_continue_freshness: 7200
  image_input_mode: auto
  disabled_toolsets:
  - image_gen
  - tts
  - x_search
  - spotify
  - homeassistant
  verbose: false
  reasoning_effort: high
  personalities: {}
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 300
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  persistent_shell: true
  lifetime_seconds: 600
browser:
  inactivity_timeout: 300
  command_timeout: 60
  record_sessions: false
  allow_private_urls: false
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  dialog_policy: must_respond
checkpoints:
  enabled: true
  max_snapshots: 50
  max_total_size_mb: 1000
  max_file_size_mb: 20
  auto_prune: true
  retention_days: 14
tool_output:
  max_bytes: 100000
  max_lines: 3000
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 3
    same_tool_failure: 5
    idempotent_no_progress: 3
  hard_stop_after:
    exact_failure: 8
    same_tool_failure: 12
    idempotent_no_progress: 8
compression:
  enabled: true
  threshold: 0.3
  target_ratio: 0.15
  protect_last_n: 30
  hygiene_hard_message_limit: 500
  protect_first_n: 5
prompt_caching:
  cache_ttl: 10m
display:
  compact: false
  personality: technical
  resume_display: full
  busy_input_mode: interrupt
  tui_auto_resume_recent: false
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  timestamps: false
  final_response_markdown: strip
  persistent_output: true
  persistent_output_max_lines: 500
  inline_diffs: true
  file_mutation_verifier: true
  show_cost: false
  skin: default
  language: en
  tui_status_indicator: kaomoji
  user_message_preview:
    first_lines: 3
    last_lines: 3
  interim_assistant_messages: true
  tool_progress_command: false
  tool_progress_overrides: {}
  tool_preview_length: 0
  ephemeral_system_ttl: 0
  platforms: {}
  runtime_footer:
    enabled: true
    fields:
    - model
    - context_pct
    - cwd
    - status
  copy_shortcut: auto
  tool_progress: all
  cleanup_progress: false
  background_process_notifications: all
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000
  user_char_limit: 1800
  provider: ''
delegation:
  model: ''
  provider: ''
  base_url: ''
  api_key: ''
  api_mode: ''
  inherit_mcp_toolsets: true
  max_iterations: 100
  child_timeout_seconds: 900
  reasoning_effort: ''
  max_concurrent_children: 5
  max_spawn_depth: 2
  orchestrator_enabled: true
  subagent_auto_approve: false
goals:
  max_turns: 30
skills:
  external_dirs: []
  template_vars: true
  inline_shell: false
  inline_shell_timeout: 15
  guard_agent_created: false
  disabled:
  - airtable
  - architecture-diagram
  - arxiv
  - ascii-art
  - ascii-video
  - audiocraft-audio-generation
  - baoyu-article-illustrator
  - baoyu-comic
  - baoyu-infographic
  - blogwatcher
  - claude-code
  - claude-design
  - codex
  - comfyui
  - debugging-hermes-tui-commands
  - design-md
  - dogfood
  - dspy
  - evaluating-llms-harness
  - excalidraw
  - gif-search
  - godmode
  - google-workspace
  - heartmula
  - humanizer
  - jupyter-live-kernel
  - linear
  - llama-cpp
  - llm-wiki
  - manim-video
  - maps
  - minecraft-modpack-server
  - notion
  - obliteratus
  - obsidian
  - openhue
  - pixel-art
  - pokemon-player
  - powerpoint
  - sketch
  - songsee
  - songwriting-and-ai-music
  - spotify
  - touchdesigner-mcp
  - youtube-content
  - yuanbao
curator:
  enabled: true
  interval_hours: 24
  min_idle_hours: 1
  stale_after_days: 14
  archive_after_days: 60
  backup:
    enabled: true
    keep: 10
discord:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true
  thread_require_mention: false
  history_backfill: true
  history_backfill_limit: 100
  reactions: true
  channel_prompts: {}
approvals:
  mode: manual
  timeout: 120
  cron_mode: allow
  mcp_reload_confirm: true
  destructive_slash_confirm: true
cron:
  wrap_response: true
  max_parallel_jobs: 10
dispatch:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 15
  failure_limit: 3
  worker_log_rotate_bytes: 4194304
  worker_log_backup_count: 3
  orchestrator_profile: orchestrator
  default_assignee: orchestrator
  auto_decompose: true
  auto_decompose_per_tick: 5
  dispatch_stale_timeout_seconds: 7200
code_execution:
  mode: project
  timeout: 600
  max_tool_calls: 100
logging:
  level: INFO
  max_size_mb: 10
  backup_count: 5
system_prompt: "You are Orchestrator, the CEO of Zero Factory AI company.\n\nYour\
  \ role:\n  - Decompose complex goals into parallelizable work packages\n  - Dispatch\
  \ tasks to specialist agents (Builder, Researcher, Reviewer, QA, Scribe)\n  - Monitor\
  \ kanban board progress and unblock stalled work\n  - Coordinate handoffs between\
  \ development stages\n  - Track dependencies and decide what can run in parallel\n\
  \  - Report concise status to human when needed\n  - Never write code directly \u2014\
  \ delegate coding to Builder\n  - Never review code directly \u2014 delegate to\
  \ Reviewer\n\nWorkflow Pipeline:\n  Goal \u2192 Researcher (analyze) \u2192 Builder\
  \ (implement) \u2192 Reviewer (review) \u2192 QA (test) \u2192 Scribe (document)\
  \ \u2192 Done\n\nCommunication Style:\n  - Concise, direct, action-oriented\n  -\
  \ Reference task IDs and kanban states\n  - Summarize status clearly when reporting\
  \ to human\n\nConstraints:\n  - Respect hardware limits for concurrency\n  - Minimize\
  \ token usage across all agents\n  - Keep workflows to fewest steps possible\n \
  \ - Zero temperature \u2014 logical, deterministic decisions\n\nOutput format: Status\
  \ reports, dispatch instructions, dependency mapping, escalation flags.\n"
description: Project manager & orchestrator
